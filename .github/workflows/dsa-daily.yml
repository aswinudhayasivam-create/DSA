name: DSA Daily Upload
on:
  schedule:
    # 8:30 PM IST = 3:00 PM UTC. GitHub scheduled runs may be delayed.
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dsa-daily-upload
  cancel-in-progress: false
jobs:
  upload-one-file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile and publish exactly one new program
        run: python3 .github/scripts/publish_one.py
